# Add a term as a swap line here, then sync: every repo carries this file byte for byte.
# Match only the coined sense. Ordinary English such as a room's floor must not match;
# lint/tests/testdata/coined_terms/ok.md holds sentences that must stay clean.
---
extends: substitution
message: "Use '%s' instead of the coined term '%s'."
level: error
ignorecase: true
action:
  name: replace
swap:
  green heads?: head whose checks passed
  green lines?: CI passed
  keeper (session|role)s?: scheduler
  go-lines?: merge message
  floor rules: org-wide rules
  baseline floor: org-wide rules
