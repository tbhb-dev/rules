StylesPath = .vale
MinAlertLevel = warning
# vale_test reports findings with --no-exit.
Vocab = project
# OKF type values are schema labels, not prose. Titles and descriptions remain linted.
IgnoredScopes = code, tt, text.frontmatter.type
Packages = \
  https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-experimental.zip

[*.md]
BasedOnStyles = Vale, Google, project, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = warning
ai-tells-experimental.AverageSentenceLength = warning
ai-tells-experimental.ComplexWordDensity = warning
ai-tells-experimental.ContentDuplication = warning
ai-tells-experimental.ContractionAvoidance = warning
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = warning
ai-tells-experimental.PassiveDensity = warning
ai-tells-experimental.PassiveVoice = warning
ai-tells-experimental.PassiveVoiceAdverb = warning
ai-tells-experimental.SentenceLengthVariance = warning
ai-tells-experimental.SentenceStartEntropy = warning
ai-tells-experimental.SentenceStartRepetition = warning
ai-tells-experimental.TransitionRepetition = warning
ai-tells-experimental.TricolonDensityDocument = warning
ai-tells-experimental.VocabularySwap = warning
project.Acronyms = warning
# ai-tells.ColonUsage (from BasedOnStyles) exempts headings and acronyms,
# so it supersedes project.Colons outside commit messages.
project.Colons = NO
project.HeadingTitleCase = warning
project.WordList = warning
# Google.Acronyms is disabled: project.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to project exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = warning
Google.Ellipses = warning
Google.FirstPerson = warning
Google.HeadingPunctuation = warning
Google.Headings = NO
Google.OxfordComma = warning
Google.Parens = NO
# The tagger-based passive rules pinned above (PassiveVoice,
# PassiveVoiceAdverb, PassiveDensity) flag every grammatical passive
# without the predicate-adjective false positives of the regex rules,
# so Google.Passive, write-good.Passive, and write-good.E-Prime stay
# off, and the style no longer ships its own Passive consolidation.
Google.Passive = NO
Google.Ranges = warning
Google.Semicolons = warning
Google.Spelling = warning
Google.We = warning
Google.Will = warning
Google.WordList = NO
# Same case-insensitive word-substitution shape as WordList above, so
# the same false-positive risk: "Touch ID" is Apple's proper-noun name
# for the biometric feature, and the rule's stock swap rewrites it to
# the nonexistent "tap ID."
Google.WordListCase = NO
# Off: vale 3.24 crashes with "index out of range" (exit 2) on a match
# spanning a newline, such as an intensifier ending one line before a
# listed word opens the next (#139). The rule's edit action splits the
# match on a space, and a match across a line break has none.
proselint.Uncomparables = NO
proselint.Annotations = NO
proselint.P-Value = warning
write-good.Cliches = warning
write-good.E-Prime = NO
write-good.Illusions = warning
write-good.Passive = NO
write-good.TooWordy = warning
write-good.Weasel = warning

[{.vale/**/*.md,tmp/**/*.md,.venv/**,.bazel-*/**,bazel-*/**}]
BasedOnStyles =
