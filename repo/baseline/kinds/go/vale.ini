# Copyright Tony Burns

StylesPath = .vale
MinAlertLevel = warning
# vale_test reports findings with --no-exit.
Vocab = project
# OKF type values are schema labels, not prose. Titles and descriptions remain linted.
IgnoredScopes = code, tt, text.frontmatter.type
Packages = \
  https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/errata-ai/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-experimental.zip

[*.md]
BasedOnStyles = Vale, Google, project, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = warning
ai-tells-experimental.AverageSentenceLength = warning
ai-tells-experimental.ComplexWordDensity = warning
ai-tells-experimental.ContentDuplication = warning
ai-tells-experimental.ContractionAvoidance = warning
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = warning
ai-tells-experimental.PassiveDensity = warning
ai-tells-experimental.PassiveVoice = warning
ai-tells-experimental.PassiveVoiceAdverb = warning
ai-tells-experimental.SentenceLengthVariance = warning
ai-tells-experimental.SentenceStartEntropy = warning
ai-tells-experimental.SentenceStartRepetition = warning
ai-tells-experimental.TransitionRepetition = warning
ai-tells-experimental.TricolonDensityDocument = warning
ai-tells-experimental.VocabularySwap = warning
project.Acronyms = warning
# ai-tells.ColonUsage (from BasedOnStyles) exempts headings and acronyms,
# so it supersedes project.Colons outside commit messages.
project.Colons = NO
project.HeadingTitleCase = warning
project.WordList = warning
# Google.Acronyms is disabled: project.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to project exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = warning
Google.Ellipses = warning
Google.FirstPerson = warning
Google.HeadingPunctuation = warning
Google.Headings = NO
Google.OxfordComma = warning
Google.Parens = NO
# The tagger-based passive rules pinned above (PassiveVoice,
# PassiveVoiceAdverb, PassiveDensity) flag every grammatical passive
# without the predicate-adjective false positives of the regex rules,
# so Google.Passive, write-good.Passive, and write-good.E-Prime stay
# off, and the style no longer ships its own Passive consolidation.
Google.Passive = NO
Google.Ranges = warning
Google.Semicolons = warning
Google.Spelling = warning
Google.We = warning
Google.Will = warning
Google.WordList = NO
# Same case-insensitive word-substitution shape as WordList above, so
# the same false-positive risk: "Touch ID" is Apple's proper-noun name
# for the biometric feature, and the rule's stock swap rewrites it to
# the nonexistent "tap ID."
Google.WordListCase = NO
# Off: vale 3.24 crashes with "index out of range" (exit 2) on a match
# spanning a newline, such as an intensifier ending one line before a
# listed word opens the next (#139). The rule's edit action splits the
# match on a space, and a match across a line break has none.
proselint.Uncomparables = NO
proselint.Annotations = NO
proselint.P-Value = warning
write-good.Cliches = warning
write-good.E-Prime = NO
write-good.Illusions = warning
write-good.Passive = NO
write-good.TooWordy = warning
write-good.Weasel = warning

[*.go]
BasedOnStyles = Vale, Google, project, write-good, proselint, ai-tells, ai-tells-experimental
ai-tells.AIAdjectiveNounPairs = warning
# Every Go file opens with the SPDX license header comment, and
# ColonUsage flags the proper noun after its colon. The
# rule's own guidance is to disable it where a colon convention is
# established, so it stays off for Go source.
ai-tells.ColonUsage = NO
ai-tells-experimental.AverageSentenceLength = warning
ai-tells-experimental.ComplexWordDensity = warning
# Off for Go source. The analyzer reads the whole file as prose, so repeated
# statements such as `return T{}, err` register as duplicated passages. The
# finding scales with the amount of code, not with the writing.
ai-tells-experimental.ContentDuplication = NO
ai-tells-experimental.ContractionAvoidance = warning
ai-tells-experimental.HeadingTitleCase = NO
ai-tells-experimental.LongWordDensity = NO
ai-tells-experimental.ParagraphLengthVariance = warning
ai-tells-experimental.PassiveDensity = warning
ai-tells-experimental.PassiveVoice = warning
ai-tells-experimental.PassiveVoiceAdverb = warning
ai-tells-experimental.SentenceLengthVariance = warning
ai-tells-experimental.SentenceStartEntropy = warning
# Off for Go source. The analyzer reads the whole file as prose, so
# `return` and `if` statements register as repeated sentence openers and
# the finding scales with file length rather than with anything about the
# writing. Comment prose is still covered by the rest of the set.
ai-tells-experimental.SentenceStartRepetition = NO
ai-tells-experimental.TransitionRepetition = warning
ai-tells-experimental.TricolonDensityDocument = warning
ai-tells-experimental.VocabularySwap = warning
project.Acronyms = warning
# Superseded by ai-tells.ColonUsage (see the *.md section), which is
# itself off for Go source per the SPDX note above.
project.Colons = NO
project.HeadingTitleCase = warning
project.WordList = warning
# Google.Acronyms is disabled: project.Acronyms is the same rule with
# project-specific exceptions (LLM, GPT, DCO). Keeping both enabled fires
# the Google version even after we add an acronym to project exceptions.
Google.Acronyms = NO
Google.Colons = NO
Google.Contractions = warning
Google.Ellipses = warning
Google.FirstPerson = warning
Google.HeadingPunctuation = warning
Google.Headings = NO
Google.OxfordComma = warning
Google.Parens = NO
# Google.Passive and write-good.Passive disabled: the tagger-based
# ai-tells-experimental passive rules flag every grammatical passive
# without the predicate-adjective false positives of the regex shape,
# so the regex rules and write-good.E-Prime retire.
Google.Passive = NO
Google.Ranges = warning
Google.Semicolons = warning
# Google.Spacing flags "errors.Is" and "errors.Join" as missing a space
# after the period. False positive on dotted Go identifiers; keep off for
# Go source.
Google.Spacing = NO
Google.Spelling = warning
Google.We = warning
Google.Will = warning
Google.WordList = NO
# Same case-insensitive word-substitution shape as WordList above, so
# the same false-positive risk: "Touch ID" is Apple's proper-noun name
# for the biometric feature, and the rule's stock swap rewrites it to
# the nonexistent "tap ID."
Google.WordListCase = NO
# Off: vale 3.24 crashes with "index out of range" (exit 2) on a match
# spanning a newline, such as an intensifier ending one line before a
# listed word opens the next (#139). The rule's edit action splits the
# match on a space, and a match across a line break has none.
proselint.Uncomparables = NO
proselint.Annotations = NO
proselint.P-Value = warning
write-good.Cliches = warning
write-good.E-Prime = NO
write-good.Illusions = warning
write-good.Passive = NO
write-good.TooWordy = warning
write-good.Weasel = warning

# The PR draft's H1 is a Conventional Commit title.
[.github/PULL_REQUEST_DRAFT.md]
project.HeadingTitleCase = NO

# Test files inherit the rule set from [*.go] but silence the
# ai-tells-experimental rules that misfire on table-driven test
# code:
#
#   ContentDuplication — table cases legitimately reuse struct
#                        literals and identifier names across rows.
#   SentenceStartRepetition — every doc comment on a helper function
#                             starts with "//", which the analyzer
#                             treats as a repeated sentence opener.
#   ParagraphLengthVariance — the "paragraphs" it measures in a test
#                             file are blank-line-separated blocks of
#                             Go, and t.Run subtests are uniform by
#                             construction. Prose pacing is not a
#                             property test code has.
#   PassiveDensity — the ratio it reports is drawn from Go source, not
#                    from writing. Sentences split on a period followed
#                    by a space, which test code hardly ever contains,
#                    so a whole file collapses into a handful of them;
#                    the passives it counts against that denominator
#                    are t.Run names like "wrapped write is denied",
#                    where the passive is the idiomatic way to name the
#                    behavior under test. A file clears the rule's
#                    six-sentence floor as soon as anyone writes a
#                    comment, which is the wrong thing to discourage.
[**/*_test.go]
ai-tells-experimental.ContentDuplication = NO
ai-tells-experimental.SentenceStartRepetition = NO
ai-tells-experimental.ParagraphLengthVariance = NO
ai-tells-experimental.PassiveDensity = NO

# Test fixtures hold PR drafts whose H1 is a Conventional Commit header, which
# the sentence-case heading rule would flag; the PR script lints drafts itself.
[{CHANGELOG.md,.vale/**/*.md,tmp/**/*.md,tools/**/testdata/**/*.md,.venv/**,bazel-*/**,.bazel-*/**}]
BasedOnStyles =
