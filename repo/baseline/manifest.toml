schema_version = 1
kinds = ["go", "python", "docs", "chezmoi"]

# Values come from the writer.
placeholders = ["repo_name", "rules_sha", "renovate_config_sha", "kind", "private", "mcp_server", "mcp_module", "mcp_endpoint", "mcp_token_file", "mcp_endpoint_env", "mcp_token_file_env"]

# Repository-owned files; writers must also honor glob patterns here.
never_write = [".gitleaksignore", "AGENTS.md", "CLAUDE.md", "README.md", "CHANGELOG.md", "MODULE.bazel.lock", "mise.lock", ".cspell-words.txt", ".vale/config/vocabularies/**", "go.mod", "go.sum", "pyproject.toml", "uv.lock", ".go-arch-lint.yml", ".bazelrc.user", "mise.local.toml", ".claude/settings.local.json", "preset.bazelrc", "vale_packages.bzl"]

[[file]]
path = ".bazelversion"
source = "files/bazelversion"
mode = "bytes"
visibility = "all"

[[file]]
path = ".github/actionlint.yaml"
source = "files/.github/actionlint.yaml"
mode = "bytes"
visibility = "all"

[[file]]
