---
# Everything a Bazel CI job does between checkout and the first Bazel
# command that tests. The caller checks out first: a composite action in
# this repository is only reachable by a local path after checkout, and
# Bazel needs the sources anyway.
name: Set up Bazel for CI
description: >-
  Harden the runner, set up Bazel with its caches, make Windows and Linux
  arm64 runners build, and fetch the dependencies with retries.

inputs:
  disk-cache:
    description: >-
      The disk cache key for setup-bazel, or "false" for no disk cache. Pass a
      key that is unique per job, such as the workflow, OS and workspace.
    required: false
    default: "false"
  cache-save:
    description: >-
      Whether this run may save the Bazel caches: "true" or "false". Pull
      requests should not, so pass true only for events other than
      pull_request (see the README).
    required: false
    default: "false"
  targets:
    description: >-
      The Bazel targets to fetch, retrying transient failures, split on
      whitespace. Empty skips the fetch.
    required: false
    default: //...
  working-directory:
    description: The directory of the Bazel workspace the fetch runs in.
    required: false
    default: .

runs:
  using: composite
  steps:
    # harden-runner monitors Linux runners only.
    - name: Harden the runner
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
      with:
        egress-policy: audit

    # On Windows the rules' scripts run under the shell toolchain's Bash,
    # MSYS2's on the hosted image. Only there: elsewhere Bazel would run
    # genrule commands with it too.
    - name: Point Bazel at Bash
      if: runner.os == 'Windows'
      shell: bash
      run: |
        # A self-hosted Windows runner may lack MSYS2, and Bazel then fails
        # much later with a less direct error.
        if [ ! -f /c/msys64/usr/bin/bash.exe ]; then
          echo "::error::MSYS2's Bash isn't at C:/msys64/usr/bin/bash.exe. Install MSYS2 at C:/msys64 on this runner."
          exit 1
        fi
        echo 'BAZEL_SH=C:/msys64/usr/bin/bash.exe' >>"$GITHUB_ENV"

    # nproc and Python's os.cpu_count() count the host's CPUs, not a
    # container's CPU quota, so pytest-xdist's `-n auto` would start a worker
    # per host CPU. Bazel already honors the quota. pytest_test passes this
    # variable through, and xdist uses it for `-n auto`. A runner with no
    # quota (cgroup v1, or cpu.max of "max") is left alone.
    - name: Size test workers to the CPU quota
      if: runner.os == 'Linux'
      shell: bash
      # The value written is an integer from shell arithmetic on a kernel
      # file, so the write can't carry anything else.
      run: |  # zizmor: ignore[github-env]
        [ -r /sys/fs/cgroup/cpu.max ] || exit 0
        read -r quota period </sys/fs/cgroup/cpu.max
        [ "${quota}" != max ] || exit 0
        workers=$(( (quota + period - 1) / period ))
        [ "${workers}" -ge 1 ] || workers=1
        [ "${workers}" -lt "$(nproc)" ] || exit 0
        echo "PYTEST_XDIST_AUTO_NUM_WORKERS=${workers}" >>"$GITHUB_ENV"

    - name: Set up Bazel
      uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
      with:
        # Self-hosted runners have no bazelisk; with a version set, the
        # action downloads it when it's missing, as `bazel`.
        bazelisk-version: 1.30.0
        bazelisk-cache: true
        disk-cache: ${{ inputs.disk-cache }}
        repository-cache: true
        cache-save: ${{ inputs.cache-save }}

    # setup-bazel installs the pinned bazelisk under the name `bazel`, so a
    # runner without its own bazelisk has no `bazelisk` command. Link one next
    # to it, in the directory setup-bazel already put on PATH.
    - name: Make bazelisk callable by name
      shell: bash
      run: |
        if ! command -v bazelisk >/dev/null 2>&1; then
          bazel="$(command -v bazel)"
          dir="$(dirname "${bazel}")"
          # Git Bash prints the Windows path without .exe.
          if [ -f "${dir}/bazel.exe" ]; then
            cp "${dir}/bazel.exe" "${dir}/bazelisk.exe"
          else
            ln -s "${bazel}" "${dir}/bazelisk"
          fi
        fi

    # complexipy publishes no Python 3.15 wheel for Linux arm64, so uv builds
    # it from source there with maturin, which needs Rust and a C compiler. A
    # runner image may have neither, so the step brings both: Rust's
    # standalone component archives and zig, each checked against a pinned
    # sha256, with zig serving as cc, c++ and ar. Python unpacks zig's .tar.xz
    # because an image may lack xz. cc-rs passes Rust's target triple, which
    # zig can't parse; the shims drop it and build for the host, the only
    # target here. tbhb_rules' python_env_repo hands PATH to uv, so nothing
    # else is needed. Drop this step once a cp315 manylinux aarch64 wheel
    # exists.
    - name: Set up Rust for complexipy's source build
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      env:
        RUST_VERSION: 1.99.1
        SHA256_RUSTC: e4656174f0ba5ea3dab5f58d069b7afae6d7616187de31c65cb6432e4f941399
        SHA256_CARGO: 201dbeac1795713b98aeae044e01695e70ae2ea3ded42683ebce5a8a1c90f8a6
        SHA256_RUST_STD: 32d1ddb44cd49d6497ab6a24f440d4286a20b2667fdf928b876f59c66d13d722
        ZIG_VERSION: 0.17.1
        SHA256_ZIG: a1546d5646eb184437918d6635ca6b762a0e889eac09cef720ee7a1ed3fe7795
      run: |  # zizmor: ignore[github-env]
        root="${RUNNER_TEMP}/rust-toolchain"
        mkdir -p "${root}/dl" "${root}/rust" "${root}/zig" "${root}/cc"
        fetch() {
          curl -fsSL --retry 3 -o "${root}/dl/$3" "$1"
          echo "$2  ${root}/dl/$3" | sha256sum -c --quiet -
        }
        for component in rustc:"${SHA256_RUSTC}" cargo:"${SHA256_CARGO}" rust-std:"${SHA256_RUST_STD}"; do
          name="${component%%:*}-${RUST_VERSION}-aarch64-unknown-linux-gnu"
          fetch "https://static.rust-lang.org/dist/${name}.tar.gz" "${component#*:}" "${name}.tar.gz"
          tar -xzf "${root}/dl/${name}.tar.gz" -C "${root}/dl"
          bash "${root}/dl/${name}/install.sh" --prefix="${root}/rust" --disable-ldconfig >/dev/null
          rm -rf "${root}/dl/${name}" "${root}/dl/${name}.tar.gz"
        done
        zig_name="zig-aarch64-linux-${ZIG_VERSION}"
        fetch "https://ziglang.org/download/${ZIG_VERSION}/${zig_name}.tar.xz" "${SHA256_ZIG}" "${zig_name}.tar.xz"
        python3 -c 'import sys, tarfile; tarfile.open(sys.argv[1], "r:xz").extractall(sys.argv[2], filter="data")' \
          "${root}/dl/${zig_name}.tar.xz" "${root}/zig"
        rm -f "${root}/dl/${zig_name}.tar.xz"
        for tool in cc c++ ar; do
          printf '%s\n' '#!/usr/bin/env bash' 'args=()' 'for arg in "$@"; do' \
            '  case "${arg}" in --target=*) ;; *) args+=("${arg}") ;; esac' 'done' \
            "exec '${root}/zig/${zig_name}/zig' ${tool} \"\${args[@]}\"" >"${root}/cc/${tool}"
          chmod +x "${root}/cc/${tool}"
        done
        echo "${root}/rust/bin" >>"${GITHUB_PATH}"
        echo "${root}/cc" >>"${GITHUB_PATH}"

    # Some runfiles paths pass Windows' 260-character limit under the
    # default output root in the runner's profile. The user bazelrc reaches
    # the workspace wherever it is. After setup-bazel, which writes that file
    # too and leaves its last line unterminated, hence the leading newline.
    - name: Shorten Bazel's output root
      if: runner.os == 'Windows'
      shell: bash
      run: printf '\nstartup --output_user_root=C:/b\n' >>"$HOME/.bazelrc"

    # Even under that root, a few paths in the Python runtime's packages
    # pass 260 characters; Python reads them only with long paths enabled.
    - name: Enable long paths
      if: runner.os == 'Windows'
      shell: bash
      run: reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' //v LongPathsEnabled //t REG_DWORD //d 1 //f

    # Fetching hits go.dev's release list (go_sdk.from_file), PyPI, GitHub
    # and the BCR mirror, which can fail for longer than Bazel's own
    # download retries wait. Only the fetch is retried: a test failure never
    # is.
    - name: Fetch, retrying transient failures
      if: inputs.targets != ''
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TARGETS: ${{ inputs.targets }}
      run: |
        read -ra targets <<<"${TARGETS}"
        for attempt in 1 2 3; do
          bazelisk fetch --config=ci "${targets[@]}" && break
          if ((attempt == 3)); then exit 1; fi
          sleep 60
        done
