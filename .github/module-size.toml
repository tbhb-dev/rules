# The last pattern also excludes the TypeScript declarations generated by Wrangler.
ignore_globs = [
  "**/node_modules/**",
  "**/vendor/**",
  "**/.bazel*/**",
  "**/*.pb.go",
  "**/*_pb2.py",
  "**/generated/**",
  "cloudflare/e2e/smoke/**/worker-configuration.d.ts",
]

[baseline]
"go/private/gomutants/main.go" = 645
"go/private/gomutants/main_test.go" = 1293
"lint/private/content/check_design.py" = 639
"python/private/mutmut_report.py" = 710
"repo/tests/test_check_required_files.py" = 1073
