---
name: tier0-approval

on:
  workflow_call:
    inputs:
      check_workflows:
        description: Required check names and numeric workflow IDs, one context:workflow-id per line.
        type: string
        required: true
      tier0_paths:
        description: Allowed path globs, one per line.
        type: string
        default: |
          **/*.md
          docs/**
          LICENSE*
      deny_paths:
        description: Blocked path globs, one per line.
        type: string
        default: |
          .github/**
          **/CODEOWNERS
      design_paths:
        description: Path globs that require a design go SHA, one per line.
        type: string
      design_go_sha:
        description: Head SHA cleared for design changes. Defaults to the DESIGN_GO_SHA repository variable.
        type: string
      max_files:
        description: Maximum changed paths, counting both sides of a rename.
        type: number
        default: 50
      mode:
        description: Evaluate the pull request or enforce the decision with a review and merge.
        type: string
        default: evaluate
    secrets:
      PIN_APPROVER_CLIENT_ID:
        required: true
      PIN_APPROVER_PRIVATE_KEY:
        required: true
    outputs:
      decision:
        value: ${{ jobs.approval.outputs.decision }}
      reason:
        value: ${{ jobs.approval.outputs.reason }}
      head_sha:
        value: ${{ jobs.approval.outputs.head_sha }}

permissions: {}

jobs:
  approval:
    name: Tier-0 approval
    if: github.event_name == 'workflow_run' && github.event.action == 'completed'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: pins-approver
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      reason: ${{ steps.decide.outputs.reason }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c  # v2.23.0
        with:
          egress-policy: audit

      - name: Check out the reusable workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The pinned actionlint predates these job properties.
          repository: tbhb-dev/rules
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: rules
          persist-credentials: false

      - name: Verify the checkout
        env:
          RULES_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: |
          checkout_sha=$(git -C rules rev-parse HEAD)
          test "${RULES_SHA:?Missing job.workflow_sha}" = "$checkout_sha"

      - name: Mint the approver token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc  # v3.4.0
        with:
          client-id: ${{ secrets.PIN_APPROVER_CLIENT_ID }}
          private-key: ${{ secrets.PIN_APPROVER_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: ${{ inputs.mode == 'enforce' && 'write' || 'read' }}
          permission-pull-requests: ${{ inputs.mode == 'enforce' && 'write' || 'read' }}

      - name: Decide tier-0 approval
        id: decide
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          CHECK_WORKFLOWS: ${{ inputs.check_workflows }}
          TIER0_PATHS: ${{ inputs.tier0_paths }}
          DENY_PATHS: ${{ inputs.deny_paths }}
          DESIGN_PATHS: ${{ inputs.design_paths }}
          DESIGN_GO_SHA: ${{ inputs.design_go_sha || vars.DESIGN_GO_SHA }}
          MAX_FILES: ${{ inputs.max_files }}
          MODE: ${{ inputs.mode }}
        run: python3 -I -S rules/repo/private/tier0_approval/__main__.py

      - name: Upload the decision
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tier0-decision
          path: tier0-decision.json
          if-no-files-found: error
