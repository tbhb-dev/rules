---
# Main quality gate. Each gate runs as its own job so the PR status shows
# which one fired, and a final `conclusion` job gives branch protection one
# stable required check. Bazel pins and runs every tool.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # tbhb_rules targets Bazel 9.x only (bazel_compatibility >= 9.0.0, and
  # .bazelversion pins the release), so the matrix varies only the platform:
  # one runner for each platform the tool pins cover that GitHub hosts. It
  # runs this repository's own gates, including the Python ones, on its own
  # rules, the nested modules and the e2e consumers.
  bazel:
    name: "bazel (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # On Windows the rules' scripts run under the shell toolchain's Bash,
      # MSYS2's on the hosted image. Only there: elsewhere Bazel would run
      # genrule commands with it too.
      - name: Point Bazel at Bash
        if: runner.os == 'Windows'
        run: echo 'BAZEL_SH=C:/msys64/usr/bin/bash.exe' >>"$GITHUB_ENV"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Some runfiles paths pass Windows' 260-character limit under the
      # default output root in the runner's profile. The user bazelrc reaches
      # every workspace the job tests. After setup-bazel, which writes that file
      # too and leaves its last line unterminated, hence the leading newline.
      - name: Shorten Bazel's output root
        if: runner.os == 'Windows'
        run: printf '\nstartup --output_user_root=C:/b\n' >>"$HOME/.bazelrc"

      # Even under that root, a few paths in the Python runtime's packages
      # pass 260 characters; Python reads them only with long paths enabled.
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' //v LongPathsEnabled //t REG_DWORD //d 1 //f

      # //... covers this repository's gates (buildifier, the lint tests, the
      # shell checks, the bats suite and the rule families' proofs) and
      # preset.update_test, which fails when preset.bazelrc is stale.
      - name: Test
        run: bazelisk test //...

      # The smoke module's proofs run here too: each expect_failure_test
      # passes only when its proof fails for the stated reason.
      - name: Test the smoke consumer
        working-directory: e2e/smoke
        run: bazelisk test //...

      # The nested modules are workspaces of their own, each with its own
      # gates and consumers, on the same Bazel versions and platforms.
      - name: Test the Go module
        working-directory: go
        run: bazelisk test //...

      - name: Test the Go consumer
        working-directory: go/e2e/smoke
        run: bazelisk test //...

      - name: Test the Python module
        working-directory: python
        run: bazelisk test //...

      - name: Test the single-project Python consumer
        working-directory: python/e2e/single
        run: bazelisk test //...

      - name: Test the uv workspace Python consumer
        working-directory: python/e2e/workspace
        run: bazelisk test //...

      # Mutation reports rerun along the dependency graph: an edit reruns
      # its unit and the dependents, and the others stay cached. mutmut does
      # not run on Windows.
      - name: Prove incremental mutation
        if: runner.os != 'Windows'
        run: python/e2e/incremental.sh

  # Checks that need Git history or the GitHub API, which no sandboxed test
  # can see.
  repo:
    name: repo
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans the whole history, so it needs every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # //:gitleaks_history fails when gitleaks walked no commits of a
      # history with content. The working tree is //:gitleaks_test's job.
      - name: Scan Git history for secrets
        run: bazelisk run //:gitleaks_history

      # Advisories change while the lock stands still, so the audit is a
      # `bazel run` target, never a cached test.
      - name: Audit the locked Python dependencies
        run: bazelisk run //tools:pip_audit

      # //:zizmor_test runs the offline audits; a token turns on the online
      # ones, which need the network.
      - name: Audit workflow security online
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bazelisk run @tbhb_rules_zizmor//:zizmor --
          --persona pedantic --no-progress "${GITHUB_WORKSPACE}/.github"

      # //:codeowners_test checks that every pattern matches a path; owner
      # and syntax validation needs GitHub's API.
      - name: Check CODEOWNERS owners and syntax
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          errors="$(gh api \
            "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${HEAD_SHA}" \
            --jq '.errors')"
          count="$(printf '%s' "${errors}" | jq 'length')"
          if [ "${count}" -ne 0 ]; then
            echo "::error::CODEOWNERS has ${count} owner or syntax error(s):"
            printf '%s' "${errors}" |
              jq -r '.[] | "  line \(.line): \(.kind): \(.message)"'
            exit 1
          fi

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed, and skipped jobs count as failures here
  # so a gate that silently did not run cannot pass.
  conclusion:
    name: conclusion
    if: always()
    needs: [bazel, repo]
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Fail if any needed job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
