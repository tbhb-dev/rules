---
# Main quality gate. Each gate runs as its own job so the PR status shows
# which one fired, and a final `conclusion` job gives branch protection one
# stable required check. Bazel pins and runs every tool.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which workspaces a change can affect. Each changed file belongs to the
  # deepest workspace directory that holds it, and anything outside the
  # nested ones belongs to the root (workflows, shared rules and configs
  # included). A workspace runs when it owns a changed file or `deps` names
  # the owner: the ids of the local modules its MODULE.bazel overrides
  # (root's python is a dev dependency, which only root's own tests see).
  # Pushes to main and any other event run every workspace.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read  # the pull request's changed files, from the GitHub API
    outputs:
      workspaces: ${{ steps.plan.outputs.workspaces }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Choose the workspaces to test
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          WORKSPACES: |
            [
              {"id": "root", "dir": ".", "deps": ["python"]},
              {"id": "smoke", "dir": "e2e/smoke", "deps": ["root"]},
              {"id": "go", "dir": "go", "deps": ["root"]},
              {"id": "go-smoke", "dir": "go/e2e/smoke", "deps": ["root", "go"]},
              {"id": "python", "dir": "python", "deps": ["root"]},
              {"id": "python-single", "dir": "python/e2e/single", "deps": ["root", "python"]},
              {"id": "python-workspace", "dir": "python/e2e/workspace", "deps": ["root", "python"]}
            ]
        run: |
          files="${RUNNER_TEMP}/changed"
          if [ "${EVENT}" = pull_request ]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" \
              --jq '.[] | .filename, (.previous_filename // empty)' >"${files}"
          else
            : >"${files}"
          fi
          # The files API lists at most 3000; past that, test everything.
          count="$(wc -l <"${files}")"
          if [ "${EVENT}" != pull_request ] || [ "${count}" -ge 3000 ]; then
            printf '.github/workflows/ci.yml\n' >"${files}"
          fi
          selected="$(jq -c --rawfile files "${files}" '
            . as $ws
            | ($files | split("\n") | map(select(length > 0))) as $paths
            | def owner($p):
                ([$ws[] | select(.dir as $d | $d != "." and ($p | startswith($d + "/")))]
                  | max_by(.dir | length) // {id: "root"}) | .id;
              ($paths | map(owner(.)) | unique) as $owners
            | [$ws[]
                | select(.id as $id | .deps as $deps
                    | $owners | any(. == $id or (. as $o | $deps | index($o) != null)))
                | {id, dir}]
          ' <<<"${WORKSPACES}")"
          echo "workspaces=${selected}" >>"${GITHUB_OUTPUT}"
          ids="$(jq -r 'map(.id) | join(", ")' <<<"${selected}")"
          echo "Testing: ${ids}" >>"${GITHUB_STEP_SUMMARY}"

  # tbhb_rules targets Bazel 9.x only (bazel_compatibility >= 9.0.0, and
  # .bazelversion pins the release), so the matrix varies only the platform
  # and the workspace: one job per pair, on each platform the tool pins cover
  # that GitHub hosts, for the workspaces the plan chose. The root covers
  # this repository's gates (buildifier, the lint tests, the shell checks,
  # the bats suite and the rule families' proofs) and preset.update_test,
  # which fails when preset.bazelrc is stale. The smoke consumer's
  # expect_failure_tests pass only when each proof fails for the stated
  # reason. The nested modules are workspaces of their own, each with its
  # own gates and consumers.
  bazel:
    name: "bazel (${{ matrix.os }}, ${{ matrix.workspace.id }})"
    needs: [plan]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        workspace: ${{ fromJSON(needs.plan.outputs.workspaces) }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # On Windows the rules' scripts run under the shell toolchain's Bash,
      # MSYS2's on the hosted image. Only there: elsewhere Bazel would run
      # genrule commands with it too.
      - name: Point Bazel at Bash
        if: runner.os == 'Windows'
        run: echo 'BAZEL_SH=C:/msys64/usr/bin/bash.exe' >>"$GITHUB_ENV"

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.workspace.id }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      # Some runfiles paths pass Windows' 260-character limit under the
      # default output root in the runner's profile. The user bazelrc reaches
      # the workspace wherever it is. After setup-bazel, which writes that file
      # too and leaves its last line unterminated, hence the leading newline.
      - name: Shorten Bazel's output root
        if: runner.os == 'Windows'
        run: printf '\nstartup --output_user_root=C:/b\n' >>"$HOME/.bazelrc"

      # Even under that root, a few paths in the Python runtime's packages
      # pass 260 characters; Python reads them only with long paths enabled.
      - name: Enable long paths
        if: runner.os == 'Windows'
        run: reg add 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem' //v LongPathsEnabled //t REG_DWORD //d 1 //f

      # Fetching hits go.dev's release list (go_sdk.from_file), PyPI, GitHub
      # and the BCR mirror, which can fail for longer than Bazel's own
      # download retries wait. Only the fetch is retried: a test failure never
      # is.
      - name: Fetch, retrying transient failures
        working-directory: ${{ matrix.workspace.dir }}
        run: |
          for attempt in 1 2 3; do
            bazelisk fetch --config=ci //... && break
            if ((attempt == 3)); then exit 1; fi
            sleep 60
          done

      - name: Test
        working-directory: ${{ matrix.workspace.dir }}
        run: bazelisk test --config=ci //...

      # Mutation reports rerun along the dependency graph: an edit reruns
      # its unit and the dependents, and the others stay cached. mutmut does
      # not run on Windows.
      - name: Prove incremental mutation
        if: matrix.workspace.id == 'python-workspace' && runner.os != 'Windows'
        run: python/e2e/incremental.sh

      # A failed run's test logs, so a failure that does not recur can still
      # be read.
      - name: Keep the test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: testlogs-${{ matrix.os }}-${{ matrix.workspace.id }}
          path: |
            ${{ matrix.workspace.dir }}/bazel-testlogs/**/test.log
            ${{ matrix.workspace.dir }}/bazel-testlogs/**/test.xml
          if-no-files-found: ignore

  # Checks that need Git history or the GitHub API, which no sandboxed test
  # can see.
  repo:
    name: repo
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans the whole history, so it needs every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          bazelisk-cache: true
          repository-cache: true
          cache-save: false

      # The Go workspaces' BUILD files, as gazelle would write them.
      - name: Check that gazelle has nothing to change
        run: |
          for workspace in go go/e2e/smoke; do
            (cd "$workspace" && bazelisk run //:gazelle -- -mode=diff)
          done

      # Each module's MODULE.bazel, as `bazel mod tidy` would write it.
      - name: Check that MODULE.bazel is tidy
        run: |
          for module in . go python; do
            (cd "$module" && bazelisk mod tidy)
          done
          git diff --exit-code -- MODULE.bazel go/MODULE.bazel python/MODULE.bazel

      # Git history is not a declared input, so the history scan runs
      # outside the test graph; //:gitleaks_test covers the working tree.
      - name: Scan Git history for secrets
        run: bazelisk run //:gitleaks_history

      # Advisories change without any input changing, so the audit is never
      # a cached test.
      - name: Audit the locked Python dependencies
        run: bazelisk run //tools:pip_audit

      # //:zizmor_test runs the offline audits; a token turns on the online
      # ones, which need the network.
      - name: Audit workflow security online
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bazelisk run @tbhb_rules_zizmor//:zizmor --
          --persona pedantic --no-progress "${GITHUB_WORKSPACE}/.github"

      # //:codeowners_test checks that every pattern matches a path; owner
      # and syntax validation needs GitHub's API.
      - name: Check CODEOWNERS owners and syntax
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          errors="$(gh api \
            "repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${HEAD_SHA}" \
            --jq '.errors')"
          count="$(printf '%s' "${errors}" | jq 'length')"
          if [ "${count}" -ne 0 ]; then
            echo "::error::CODEOWNERS has ${count} owner or syntax error(s):"
            printf '%s' "${errors}" |
              jq -r '.[] | "  line \(.line): \(.kind): \(.message)"'
            exit 1
          fi

  # One stable required check for branch protection. `if: always()` runs it
  # even when a needed job failed, and skipped jobs count as failures here
  # so a gate that silently did not run cannot pass.
  # `needs` waits for every matrix leg, and the job's result is a failure
  # if any leg failed.
  conclusion:
    name: conclusion
    if: always()
    needs: [plan, bazel, repo]
    runs-on: ubuntu-24.04
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Fail if any needed job did not succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          if echo "$NEEDS" | grep -Eq '"result": "(failure|cancelled|skipped)"'; then
            echo "A required job did not succeed." >&2
            exit 1
          fi
