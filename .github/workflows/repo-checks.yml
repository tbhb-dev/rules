---
# The repository-level checks that need Git history, the network or the
# GitHub API, which no sandboxed Bazel test can see. A repository's ci.yml
# calls this as its `repo` job.
#
# The caller must grant `contents: read` on the calling job: a called
# workflow's token never has more than its caller's. Nothing else is needed.
# The caller cannot set `timeout-minutes` or `runs-on` on a job that calls a
# workflow, so they are inputs here.
#
# The download retries share one deadline, `retry-budget-minutes` after the
# Bazel setup. A retry that would sleep past it fails the step with the URL
# that kept failing, so a long outage ends in a failure instead of the
# job's timeout cancelling it. Keep the budget below `timeout-minutes`
# minus the time of the other steps: //repo/tests:retry_budget_test checks
# the defaults.
#
# This workflow sets up Bazel itself instead of using the setup-bazel-ci
# action. A local `./` path in a called workflow resolves in the *caller's*
# checkout, which does not hold that action, and a pinned remote reference
# cannot name the commit that adds it. The repository checks need none of
# that action's Windows or arm64 steps.
name: repo-checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label.
        type: string
        default: ubuntu-26.04
      timeout-minutes:
        description: The job's timeout.
        type: number
        default: 15
      retry-budget-minutes:
        description: >-
          Whole minutes that the gazelle build and `bazel mod tidy` retries
          may spend, all directories together. The Bazel setup attempts
          are outside it. Keep it below `timeout-minutes`, with time left for
          the other steps.
        type: number
        default: 8
      pip-audit-target:
        description: >-
          The Bazel target that audits the locked Python dependencies. Empty
          skips the audit.
        type: string
        default: //tools:pip_audit
      pnpm-audit-dirs:
        description: >-
          Directories, relative to the root and split on whitespace, whose
          pnpm lock `//:pnpm_audit` audits. Empty skips the audit.
        type: string
        default: ""
      pnpm-audit-workspace:
        description: >-
          The directory of the Bazel workspace that holds `//:pnpm_audit`.
        type: string
        default: .
      govulncheck-target:
        description: >-
          The Bazel target that scans the Go code for reachable
          vulnerabilities. Empty skips the scan.
        type: string
        default: ""
      govulncheck-working-directory:
        description: The directory of the Bazel workspace that holds the target.
        type: string
        default: .
      gazelle-dirs:
        description: >-
          Directories of Bazel workspaces, relative to the root and split on
          whitespace, where `//:gazelle -mode=diff` must report nothing.
          Empty skips the check.
        type: string
        default: ""
      module-dirs:
        description: >-
          Directories of Bazel modules, relative to the root and split on
          whitespace, whose MODULE.bazel must be what `bazel mod tidy`
          writes. Empty skips the check.
        type: string
        default: ""
    secrets:
      GITLEAKS_CONFIG_TOML:
        description: >-
          The private gitleaks config, for a repository that sets
          `@tbhb_rules//lint:gitleaks_private_config`. Only the history
          scan and the pull request text scan see it.
        required: false

permissions: {}

jobs:
  repo:
    name: repo
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read  # checkout, and the CODEOWNERS errors API
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans the whole history, so it needs every commit.
          fetch-depth: 0
          persist-credentials: false

      # GitHub release downloads return 504 for minutes at times, and
      # setup-bazel has no retry of its own, so a failed attempt is retried
      # after a pause. Attempts that follow a success are skipped.
      #
      # `bazelisk mod tidy` downloads a sha256-pinned helper binary from GitHub
      # releases, and the repository cache is keyed by that hash, so a run
      # that isn't a pull request saves the cache and later runs skip the
      # download. A cache is immutable once saved, and setup-bazel names it
      # from the platform, `cache-version` and a hash of MODULE.bazel alone.
      # A consumer's own jobs save under the same name, and whichever saves
      # first wins, so `cache-version` gives this job names of its own.
      - name: Set up Bazel
        id: setup_bazel_1
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        continue-on-error: true
        with:
          # Self-hosted runners have no bazelisk; with a version set, the
          # action downloads it when it's missing, as `bazel`.
          bazelisk-version: 1.30.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: repo-checks-1
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Wait before retrying the Bazel setup
        if: steps.setup_bazel_1.outcome == 'failure'
        run: sleep 60

      - name: Set up Bazel (attempt 2)
        id: setup_bazel_2
        if: steps.setup_bazel_1.outcome == 'failure'
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        continue-on-error: true
        with:
          # Self-hosted runners have no bazelisk; with a version set, the
          # action downloads it when it's missing, as `bazel`.
          bazelisk-version: 1.30.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: repo-checks-1
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Wait before the last Bazel setup attempt
        if: steps.setup_bazel_2.outcome == 'failure'
        run: sleep 120

      - name: Set up Bazel (attempt 3)
        if: steps.setup_bazel_2.outcome == 'failure'
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3  # 0.19.1
        with:
          # Self-hosted runners have no bazelisk; with a version set, the
          # action downloads it when it's missing, as `bazel`.
          bazelisk-version: 1.30.0
          bazelisk-cache: true
          repository-cache: true
          cache-version: repo-checks-1
          cache-save: ${{ github.event_name != 'pull_request' }}

      # One deadline for every retry loop below. A step output carries it to
      # them, so nothing is written to the environment file. The same step
      # writes the one `retry` function that they source.
      - name: Start the retry clock
        id: retry_clock
        env:
          BUDGET: ${{ inputs.retry-budget-minutes }}
        run: |
          now=$(date +%s)
          echo "deadline=$((now + BUDGET * 60))" >>"${GITHUB_OUTPUT}"
          # Run a command in a directory until it succeeds. Before each
          # pause, give up if the pause would pass the deadline, and name the
          # last URL in the output, which is usually the download that failed.
          cat >"${RUNNER_TEMP}/retry.sh" <<'SCRIPT'
          set -o pipefail
          retry() {
            local dir=$1 delay=30 out url
            shift
            out="$(mktemp)"
            until (cd "${dir}" && "$@") 2>&1 | tee "${out}"; do
              now=$(date +%s)
              if ((now + delay > DEADLINE)); then
                url="$(grep -oE 'https?://[^[:space:]"]+' "${out}" | tail -1 || true)"
                echo "::error::gave up after ${BUDGET} min: ${url:-no URL in the output} kept failing"
                return 1
              fi
              sleep "${delay}"
              delay=$((delay * 2))
            done
          }
          SCRIPT

      # setup-bazel installs the pinned bazelisk under the name `bazel`, so a
      # runner without its own bazelisk has no `bazelisk` command. Link one next
      # to it, in the directory setup-bazel already put on PATH.
      - name: Make bazelisk callable by name
        run: |
          if ! command -v bazelisk >/dev/null 2>&1; then
            bazel="$(command -v bazel)"
            dir="$(dirname "${bazel}")"
            # Git Bash prints the Windows path without .exe.
            if [ -f "${dir}/bazel.exe" ]; then
              cp "${dir}/bazel.exe" "${dir}/bazelisk.exe"
            else
              ln -s "${bazel}" "${dir}/bazelisk"
            fi
          fi

      # The Go workspaces' BUILD files, as gazelle would write them.
      - name: Check that gazelle has nothing to change
        if: inputs.gazelle-dirs != ''
        env:
          BUDGET: ${{ inputs.retry-budget-minutes }}
          DEADLINE: ${{ steps.retry_clock.outputs.deadline }}
          DIRS: ${{ inputs.gazelle-dirs }}
        run: |
          read -ra dirs <<<"${DIRS}"
          source "${RUNNER_TEMP}/retry.sh"
          for dir in "${dirs[@]}"; do
            # Build gazelle first, retrying: that is where the downloads
            # happen. The diff run itself exits non-zero when gazelle has
            # changes, a real failure that a retry must not hide.
            retry "${dir}" bazelisk build //:gazelle
            (cd "${dir}" && bazelisk run //:gazelle -- -mode=diff)
          done

      # Each module's MODULE.bazel, as `bazel mod tidy` would write it.
      - name: Check that MODULE.bazel is tidy
        if: inputs.module-dirs != ''
        env:
          BUDGET: ${{ inputs.retry-budget-minutes }}
          DEADLINE: ${{ steps.retry_clock.outputs.deadline }}
          DIRS: ${{ inputs.module-dirs }}
        run: |
          read -ra dirs <<<"${DIRS}"
          source "${RUNNER_TEMP}/retry.sh"
          files=()
          for dir in "${dirs[@]}"; do
            # mod tidy downloads a helper binary from GitHub, so retry it. The
            # diff below is the real check and runs once.
            retry "${dir}" bazelisk mod tidy
            files+=("${dir}/MODULE.bazel")
          done
          git diff --exit-code -- "${files[@]}"

      # The scans download the gitleaks binary from GitHub releases, which
      # can fail like the downloads above. Build their targets first, under
      # the shared deadline. The scans below run once: a finding is real and
      # a retry must not hide it.
      - name: Fetch gitleaks, retrying transient failures
        env:
          BUDGET: ${{ inputs.retry-budget-minutes }}
          DEADLINE: ${{ steps.retry_clock.outputs.deadline }}
          EVENT: ${{ github.event_name }}
        run: |
          source "${RUNNER_TEMP}/retry.sh"
          retry . bazelisk build //:gitleaks_history
          if [[ ${EVENT} == pull_request ]]; then
            retry . bazelisk build @tbhb_rules//lint:gitleaks_text
          fi

      # Git history is not a declared input, so the history scan runs
      # outside the test graph; //:gitleaks_test covers the working tree.
      # The full-depth checkout fetches every branch, so the scan keeps to
      # the tested commit's history: a pull request's merge commit, or the
      # pushed commit. Another open pull request's findings stay on that
      # pull request instead of failing main.
      - name: Scan Git history for secrets
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
        run: bazelisk run //:gitleaks_history -- --log-opts=HEAD

      # A pull request's title and body become the squash commit's message,
      # so they get the same rules as the history. pr-text.yml scans them
      # again after an edit.
      - name: Scan the pull request's title and body for secrets
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_CONFIG_TOML: ${{ secrets.GITLEAKS_CONFIG_TOML }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ -z ${PR_TITLE} ]]; then
            echo "The pull request event carries no title to scan." >&2
            exit 1
          fi
          text="${RUNNER_TEMP}/pr-text.txt"
          printf '%s\n\n%s\n' "${PR_TITLE}" "${PR_BODY}" >"${text}"
          bazelisk run @tbhb_rules//lint:gitleaks_text <"${text}"

      # A pull request's own commits, base to head, must each carry an
      # allowed (author, committer) pair; the list is in tbhb_rules. The
      # squash commit a merge writes is not in the range.
      - name: Check the pull request's commit identities
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bazelisk run @tbhb_rules//lint:commit_identity -- "${BASE_SHA}" "${HEAD_SHA}"

      # Advisories change without any input changing, so the audit is never
      # a cached test.
      - name: Audit the locked Python dependencies
        if: inputs.pip-audit-target != ''
        env:
          TARGET: ${{ inputs.pip-audit-target }}
        run: bazelisk run "${TARGET}"

      # The same for each pnpm toolchain lock.
      - name: Audit the locked pnpm toolchains
        if: inputs.pnpm-audit-dirs != ''
        working-directory: ${{ inputs.pnpm-audit-workspace }}
        env:
          DIRS: ${{ inputs.pnpm-audit-dirs }}
        run: |
          read -ra dirs <<<"${DIRS}"
          for dir in "${dirs[@]}"; do
            bazelisk run //:pnpm_audit -- --dir "${GITHUB_WORKSPACE}/${dir}"
          done

      # The Go code, against the vulnerability database, the same way. The
      # SARIF is kept as an artifact, below, for a failure too.
      - name: Scan Go code for reachable vulnerabilities
        if: inputs.govulncheck-target != ''
        working-directory: ${{ inputs.govulncheck-working-directory }}
        env:
          TARGET: ${{ inputs.govulncheck-target }}
        run: bazelisk run "${TARGET}" -- --sarif="${RUNNER_TEMP}/govulncheck.sarif"

      - name: Keep the govulncheck SARIF
        if: always() && inputs.govulncheck-target != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: govulncheck-sarif
          path: ${{ runner.temp }}/govulncheck.sarif
          if-no-files-found: ignore

      # //:zizmor_test runs the offline audits; a token turns on the online
      # ones, which need the network.
      - name: Audit workflow security online
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bazelisk run @tbhb_rules_zizmor//:zizmor --
          --persona pedantic --no-progress "${GITHUB_WORKSPACE}/.github"

      # //:codeowners_test checks that every pattern matches a path; owner
      # and syntax validation needs GitHub's API. Self-hosted runners may
      # lack gh, so the call uses curl.
      - name: Check CODEOWNERS owners and syntax
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          response="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/codeowners/errors?ref=${HEAD_SHA}")"
          errors="$(printf '%s' "${response}" | jq '.errors')"
          count="$(printf '%s' "${errors}" | jq 'length')"
          if [ "${count}" -ne 0 ]; then
            echo "::error::CODEOWNERS has ${count} owner or syntax error(s):"
            printf '%s' "${errors}" |
              jq -r '.[] | "  line \(.line): \(.kind): \(.message)"'
            exit 1
          fi
