---
version: 3

allow:
  depOnAnyVendor: false
  deepScan: false

components:
  cmd:
    in: cmd/*
  thing:
    in: pkg/thing

vendors:
  cmp:
    in: github.com/google/go-cmp/**

deps:
  cmd:
    mayDependOn: [thing]
  thing:
    mayDependOn: [thing]
    canUse: [cmp]
