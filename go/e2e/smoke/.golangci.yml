version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - revive
  exclusions:
    rules:
      # The planted defects live in dirty/; the parity check lints them,
      # the clean checks do not reach them.
      - path: dirty/excluded\.go
        linters:
          - errcheck

formatters:
  enable:
    - gci
    - gofumpt
