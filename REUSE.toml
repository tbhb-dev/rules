version = 1

# Everything is Apache-2.0, so LICENSES/ holds one license text. Files that
# take a comment carry a two-line header in the file itself. The annotations
# below cover files that cannot hold a comment or that tools generate or
# rewrite, and files where a header would be noise. CC0-1.0 would be the
# usual choice for trivial config, but a single license keeps the policy
# simple and the config here is not trivial enough to give up the copyright
# notice.

# Lockfiles, checksums and other generated files.
[[annotations]]
path = [
  "mise.lock",
  "MODULE.bazel.lock",
  "**/uv.lock",
  "**/pnpm-lock.yaml",
  ".mise/locks/**",
  # Go module files, which go mod tidy rewrites.
  "**/go.mod",
  "**/go.sum",
  # D2 renders, which d2_diagrams writes.
  "**/*.d2.svg",
  "**/*.d2.png",
  "**/*.d2.sha256",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Version pins and ignore lists that hold one value per line, so tools read
# every line and a comment would break them.
[[annotations]]
path = [
  "**/.bazelversion",
  "**/.python-version",
  "**/.bazelignore",
  ".rylignore",
  ".cspell-words.txt",
  ".github/actions/setup-bazel-ci/fetch-targets.txt",
  ".vale/config/vocabularies/project/*.txt",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# JSON cannot hold comments, and test data (including the smoke module's
# fixtures) is content that a header would change: a header line in a
# fixture is one more thing the tool under test would check.
[[annotations]]
path = [
  "**/*.json",
  "**/testdata/**",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Dotfiles and docs that can take a comment but where GitHub or the
# toolchain expects the file to start with its own content. CODEOWNERS and
# README.md render on GitHub (the PR template becomes each PR's body), and LICENSE is the verbatim license text that
# GitHub's license detection reads, so it must not gain a header.
[[annotations]]
path = [
  "LICENSE",
  "README.md",
  ".github/CODEOWNERS",
  ".github/PULL_REQUEST_TEMPLATE.md",
  ".github/actions/README.md",
  ".gitattributes",
  ".gitignore",
  ".editorconfig",
  "go/.editorconfig",
  ".cspell.jsonc",
  ".bazelrc",
  "preset.bazelrc",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"

# Markdown whose first line must be its frontmatter (the OKF bundle under
# docs/) or that harnesses read verbatim (AGENTS.md, CLAUDE.md), so a header
# comment would break it.
[[annotations]]
path = [
  "docs/**/*.md",
  "**/AGENTS.md",
  "**/CLAUDE.md",
]
SPDX-FileCopyrightText = "Tony Burns"
SPDX-License-Identifier = "Apache-2.0"
