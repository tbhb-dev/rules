# Git hooks for this clone, installed by tools/interim/install.sh (run from the
# Claude Code SessionStart hook, or by hand with
# `uv run bash tools/interim/install.sh`, which puts the locked prek on PATH).
# The lint and format hooks join here once the bazel_env wrapper exists; they
# will call the prebuilt bazel_env binaries directly, never `bazel run`, so a
# running build's server lock can't stall a commit.
default_stages: [pre-commit]

# Never touch Vale's synced style packages, build output, or test fixtures,
# some of which are deliberately malformed for failure proofs.
exclude: ^(\.vale/(Google|write-good|proselint|ai-tells.*)/|bazel-.*/)|(^|/)testdata/

repos:
  - repo: builtin
    hooks:
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace

  # Interim agent identity, a copy of ascm's (replaced there by `ascm
  # git-hook` at M1). The module
  # needs Python 3.15, and the python3 on PATH may be older, so it runs
  # through uv. Only stamp-docs runs under prek: tools/interim/install.sh
  # installs the trailer, check and consume hooks (prepare-commit-msg,
  # commit-msg, post-commit) as plain git hooks, because prek stashes unstaged
  # changes around every stage and fails a hook when the work tree changes
  # while it runs, which a concurrent agent's edit does.
  #
  # stamp-docs rewrites the staged blob and the work-tree file together, so
  # prek's modified-files check passes. With unstaged edits next to the
  # inserted `generated:` block the work-tree rewrite can conflict: `git add`
  # the whole file or stash first.
  - repo: local
    hooks:
      - id: agent-identity-stamp-docs
        name: agent identity stamp docs
        language: system
        entry: uv run --no-project --quiet --python ">=3.15" python tools/interim/agent_identity.py stamp-docs
        stages: [pre-commit]
        types: [markdown]
        pass_filenames: false
