# Incremental mutation: depends on core, so a change there reruns this.
[project]
name = "apppkg"
version = "1.0.0"
requires-python = ">=3.15"
dependencies = ["corepkg"]

[tool.uv.sources]
corepkg = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
