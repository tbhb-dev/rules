[project]
name = "e2e-workspace"
version = "0"
requires-python = ">=3.15"
dependencies = ["apppkg", "corepkg", "clipkg", "weakpkg"]

[dependency-groups]
dev = [
  "deptry==0.25.1",
  "mutmut==3.8.1",
  "pyrefly==1.4.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["app", "cli", "core", "weak"]

[tool.uv.sources]
apppkg = { workspace = true }
corepkg = { workspace = true }
clipkg = { workspace = true }
weakpkg = { workspace = true }

[tool.pytest]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
testpaths = ["app/tests", "cli/tests", "core/tests", "tools", "weak/tests"]

[tool.coverage.run]
branch = true

[tool.importlinter]
root_packages = ["tools", "clipkg"]

[[tool.importlinter.contracts]]
name = "the commands build on gitfiles"
type = "layers"
layers = ["clipkg.docs | clipkg.layout | clipkg.mutation", "clipkg.gitfiles"]

[[tool.importlinter.contracts]]
name = "the commands are independent"
type = "independence"
modules = ["clipkg.docs", "clipkg.layout", "clipkg.mutation"]

[[tool.importlinter.contracts]]
name = "interim code stays out of clipkg"
type = "forbidden"
source_modules = ["tools.interim"]
forbidden_modules = ["clipkg"]

[[tool.importlinter.contracts]]
name = "clipkg does not use the repository tools"
type = "forbidden"
source_modules = ["clipkg"]
forbidden_modules = ["tools"]
