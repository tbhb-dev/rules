# A planted defect, only in //:proof_mutmut_member_survivor: the test runs
# the code but checks nothing, so its mutants survive.
[project]
name = "weakpkg"
version = "2.0.0"
requires-python = ">=3.15"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]
pytest_add_cli_args_test_selection = ["tests"]
