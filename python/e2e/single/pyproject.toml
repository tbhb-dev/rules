[project]
name = "e2e-single"
version = "0"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
  "deptry==0.25.1",
  "mutmut==3.8.1",
  "pyrefly==1.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tools"]

[tool.coverage.run]
branch = true

[tool.mutmut]
source_paths = ["tools"]
do_not_mutate = ["tools/test_*.py"]
pytest_add_cli_args_test_selection = ["tools"]

[tool.ruff]
extend-exclude = ["weak"]

[tool.importlinter]
root_packages = ["tools"]

[[tool.importlinter.contracts]]
name = "report builds on calc"
type = "layers"
layers = ["tools.report", "tools.calc"]
