# What `tbhbdev alpha review policy check` imports, for //lint:review_policy_test.
# tbhbdev loads every alpha module eagerly, so the check needs the whole
# package's dependencies; they get their own lock rather than weighing on
# runtime/tools. Keep them at the versions of the tbhb-dev/tools commit that
# lint/review_policy.bzl's archive pins (MODULE.bazel). The `runtime` extension
# builds @tbhb_rules_review_policy_runtime from this project and its uv.lock,
# which Renovate's uv manager keeps current.
[project]
name = "tbhb-rules-review-policy-runtime"
version = "0"
description = "Dependencies of the pinned tbhbdev review policy check"
requires-python = ">=3.15"
dependencies = [
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "jsonschema[format]==4.26.0",
  "onepasswordconnectsdk==2.1.1",
  "psycopg[binary]==3.3.8",
  "pyyaml==6.0.3",
  "tomlkit==0.15.2",
]

[tool.uv]
# Lock refreshes skip releases younger than 5 days, the same cooldown
# Renovate applies to version bumps.
exclude-newer = "5 days"
package = false
# The uv that runtime/private/versions.bzl pins; Renovate moves both.
required-version = "==0.13.8"
