[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# A checkout's own install target for `ansible-galaxy collection install`.
# The checks must never read it: ANSIBLE_COLLECTIONS_PATH, which they set to
# the pinned collections, overrides it (proof_cfg_collections_path).
collections_path = .collections
